name: CI

# Builds and tests every pull request and every push to main.
# The "Build & test" check can be required before merging (Settings → Rules → Rulesets).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test SweepV.slnx -c Release

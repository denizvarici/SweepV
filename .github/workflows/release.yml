name: Release

# Push a version tag to publish a release:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    # One clean runner per architecture: publishing x64 and x86 from the same
    # checkout can reuse stale intermediate files and produce a broken exe.
    strategy:
      matrix:
        include:
          - rid: win-x64
            arch: 64-bit
          - rid: win-x86
            arch: 32-bit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test SweepV.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/SweepV.App/SweepV.App.csproj -c Release -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version=$version `
            -o publish
          Move-Item publish/SweepV.exe "SweepV-${{ matrix.rid }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: SweepV-${{ matrix.rid }}
          path: SweepV-${{ matrix.rid }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: SweepV ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            SweepV-win-x64.exe
            SweepV-win-x86.exe
